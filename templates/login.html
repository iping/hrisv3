<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · Payroll</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=47">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="panel login-panel">
      <p class="kicker">Payroll</p>
      <h1>Masuk</h1>
      <p class="lede">Pakai akun aplikasi (bukan username petugas).</p>
      {% if salah %}
      <p class="banner" role="alert">{{ salah }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next_url or '/' }}">
        <label>Username
          <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="action" type="submit">Masuk</button>
      </form>
    </section>
  </main>
</body>
</html>
